<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生產日報 - 新增紀錄</title>
<style>
  :root{
    --bg:#EEF1EC; --card:#FFFFFF; --border:#DCE2D9; --field:#FBFCFA;
    --text:#16211A; --muted:#6B7568; --accent:#2F6B4F; --accent-bg:#E7F1EA;
    --danger:#C0392B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;color:var(--text);}
  .wrap{max-width:420px;margin:0 auto;padding-bottom:48px;}
  .topbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--border);padding:18px 20px 14px;}
  .topbar .k{font-size:12px;color:var(--muted);letter-spacing:.04em;}
  .topbar .t{font-size:20px;font-weight:700;margin-top:2px;}
  .content{padding:16px 16px 0;}
  .card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(22,33,26,.05);}
  .card h2{font-size:15px;font-weight:700;margin:0 0 14px;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  input,select,textarea{width:100%;height:44px;border-radius:12px;border:1px solid var(--border);padding:0 12px;font-size:14px;background:var(--field);color:var(--text);font-family:inherit;appearance:none;-webkit-appearance:none;}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B7568' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:14px;padding-right:34px;}
  textarea{height:84px;padding:10px 12px;resize:vertical;}
  input[readonly]{background:#F5F6F3;color:var(--muted);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;}
  .matTabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .matTab{height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--field);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;}
  .matTab.active{border-color:var(--accent);background:var(--accent);color:#fff;}
  .chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--accent-bg);color:var(--accent);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .chip button{border:none;background:transparent;color:var(--accent);cursor:pointer;font-size:14px;line-height:1;padding:0;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:20px;}
  .hint{font-size:11px;color:var(--muted);margin-top:8px;}
  .staffList{max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:12px;background:var(--field);margin-top:8px;}
  .staffItem{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13px;border-bottom:1px solid var(--border);}
  .staffItem:last-child{border-bottom:none;}
  .staffItem input{width:16px;height:16px;flex:none;}
  .submit{width:100%;height:52px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer;}
  .submit:disabled{opacity:.6;cursor:not-allowed;}
  .err{color:var(--danger);font-size:12px;margin-top:6px;display:none;}
  .badge{display:flex;align-items:center;justify-content:space-between;background:#F1F6F2;border-radius:12px;padding:10px 14px;font-size:13px;}
  .badge b{color:var(--accent);font-size:15px;}
  #resultBox{display:none;margin:14px 16px;padding:16px;border-radius:14px;background:#fff;border:1px solid var(--border);}
  #resultBox.ok{border-color:var(--accent);}
  #resultBox.fail{border-color:#E0A;}
  #resultBox pre{white-space:pre-wrap;word-break:break-all;background:var(--field);border-radius:10px;padding:10px;font-size:12px;max-height:200px;overflow:auto;}
  #resultBox button{margin-top:8px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--field);padding:0 12px;font-size:13px;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="k">生產日報</div>
    <div class="t">新增紀錄</div>
  </div>
  <div class="content">

    <div class="card">
      <h2>基本資訊</h2>
      <div class="row2">
        <div><label>日期</label><input id="f_date" type="date"></div>
        <div><label>組別</label><select id="f_group"></select></div>
      </div>
      <label>單號（系統自動產生，不用填）</label>
      <div style="height:44px;border-radius:12px;border:1px dashed var(--border);padding:0 12px;font-size:14px;color:var(--muted);background:#F5F6F3;display:flex;align-items:center;margin-bottom:12px;">送出後由 n8n 自動編號</div>
      <div class="row2">
        <div><label>加工人數</label><select id="f_people"></select></div>
        <div><label>加工型式</label><select id="f_type"></select></div>
      </div>
      <div class="row2">
        <div><label>包裝時間_起</label><input id="f_start" type="time"></div>
        <div><label>包裝時間_迄</label><input id="f_end" type="time"></div>
      </div>
      <div class="row2">
        <div><label>到貨日</label><input id="f_arrival" type="date"></div>
        <div><label>記錄（負責人員，可留空由下方人員第一位帶入）</label><input id="f_record" type="text" placeholder="例如 A00077"></div>
      </div>
      <div class="badge"><span>合計工時（分鐘）— 自動計算</span><b id="f_minutes">0</b></div>
    </div>

    <div class="card">
      <h2>訂單／產品資訊</h2>
      <label>選擇產品（依貨號 － 產品名稱 － 客戶）</label>
      <select id="f_product" style="margin-bottom:12px;" onchange="applyProduct()"></select>
      <div class="row2">
        <div><label>貨號</label><input id="f_itemno" type="text" readonly></div>
        <div><label>客戶</label><select id="f_cust"></select></div>
      </div>
      <label>產品名稱</label>
      <input id="f_pname" type="text" readonly style="margin-bottom:12px;">
      <div class="row2">
        <div><label>包裝規格</label><input id="f_spec" type="text"></div>
        <div><label>籃入數</label><input id="f_basket" type="number"></div>
      </div>
      <div class="row2" style="margin-bottom:0;">
        <div><label>品質規格</label><select id="f_qspec"></select></div>
        <div><label>完成數量</label><input id="f_done" type="number"></div>
      </div>
      <div class="err" id="err_required">請至少選擇產品、確認客戶，並填入完成數量</div>
    </div>

    <div class="card">
      <h2>原料明細</h2>
      <label>原料數</label>
      <select id="f_matcount" style="margin-bottom:14px;" onchange="renderMatTabs()">
        <option value="1">1</option><option value="2">2</option><option value="3">3</option>
      </select>
      <div class="matTabs" id="matTabsWrap"></div>
      <div id="matForms"></div>
    </div>

    <div class="card">
      <h2>標籤資訊</h2>
      <div class="row2">
        <div><label>標籤別</label><select id="f_tagtype"></select></div>
        <div><label>編號</label><input id="f_tagno" type="text"></div>
      </div>
      <div class="row2" style="margin-bottom:0;">
        <div><label>數量(張)</label><input id="f_tagcount" type="number"></div>
        <div><label>作廢(張)</label><input id="f_tagvoid" type="number"></div>
      </div>
    </div>

    <div class="card">
      <h2>人員（可複選，最多 9 人）</h2>
      <label>搜尋人員代碼</label>
      <input id="staffSearch" type="text" placeholder="輸入代碼篩選，例如 A00077" oninput="renderStaffList()">
      <div class="staffList" id="staffList"></div>
      <div class="chips" id="staffChips"></div>
      <div style="margin-top:16px;">
        <label>設備</label>
        <select id="f_equip">
          <option>包裝線 A</option>
          <option>包裝線 B</option>
          <option>分切工作站 1</option>
        </select>
        <div class="hint">原始資料的設備欄位是系統內部 ID，非人員可讀名稱，這裡先用示意站別，正式上線建議另建一份「設備ID→站名」對照表</div>
      </div>
    </div>

    <div class="card">
      <label style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:10px;">備註</label>
      <textarea id="f_note" placeholder="輸入異常、退貨原因、特殊處理說明…"></textarea>
    </div>

    <button class="submit" id="submitBtn" onclick="submitForm()">儲存並自動寫入 Excel</button>
    <div class="hint" style="text-align:center;margin-top:10px;">送出後將透過 n8n 寫入生產日報試算表</div>
  </div>
</div>

<div id="resultBox"></div>

function fillSelect(id, list, selectedIndex){
  const el = document.getElementById(id);
  el.innerHTML = list.map((v,i)=>`<option value="${v}" ${i===selectedIndex?"selected":""}>${v}</option>`).join("");
}

async function loadOptions(){
  try{
    const res = await fetch(CONFIG.OPTIONS_URL, { method:"GET" });
    if(!res.ok) throw new Error("bad status");
    const data = await res.json();
    OPTIONS = Object.assign({}, DEFAULTS, data);
  }catch(e){
    OPTIONS = JSON.parse(JSON.stringify(DEFAULTS));
  }

  fillSelect("f_group", OPTIONS.groups, OPTIONS.groups.indexOf("6"));
  fillSelect("f_people", Array.from({length:12},(_,i)=>String(i+1)), 4);
  fillSelect("f_type", OPTIONS.processTypes, 0);
  fillSelect("f_qspec", OPTIONS.qspecs, 0);
  fillSelect("f_tagtype", OPTIONS.tagTypes, 0);

  const custList = Array.from(new Set(OPTIONS.products.map(p=>p.客戶)));
  fillSelect("f_cust", custList, 0);

  const prodEl = document.getElementById("f_product");
  prodEl.innerHTML = OPTIONS.products.map((p,i)=>
    `<option value="${i}">${p.貨號} － ${p.產品名稱}（${p.客戶}）</option>`
  ).join("");
  applyProduct();

  renderStaffList();
  renderStaffChips();
  renderMatTabs();
}

function applyProduct(){
  const i = Number(document.getElementById("f_product").value || 0);
  const p = OPTIONS.products[i];
  if(!p) return;
  document.getElementById("f_itemno").value = p.貨號;
  document.getElementById("f_pname").value = p.產品名稱;
  document.getElementById("f_spec").value = p.包裝規格;
  document.getElementById("f_basket").value = p.籃入數;
  document.getElementById("f_cust").value = p.客戶;
  document.getElementById("f_qspec").value = p.品質規格 && OPTIONS.qspecs.includes(p.品質規格) ? p.品質規格 : OPTIONS.qspecs[0];
}

function calcMinutes(){
  const s = document.getElementById("f_start").value;
  const e = document.getElementById("f_end").value;
  if(!s || !e){ document.getElementById("f_minutes").textContent = "0"; return; }
  const [sh,sm]=s.split(":").map(Number), [eh,em]=e.split(":").map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if(mins < 0) mins += 24*60;
  document.getElementById("f_minutes").textContent = mins;
}
document.getElementById("f_start").addEventListener("change", calcMinutes);
document.getElementById("f_end").addEventListener("change", calcMinutes);

function renderStaffList(){
  const q = (document.getElementById("staffSearch").value || "").trim().toUpperCase();
  const list = OPTIONS.staff.filter(id => !q || id.toUpperCase().includes(q));
  const wrap = document.getElementById("staffList");
  wrap.innerHTML = list.slice(0,60).map(id=>{
    const checked = staffSelected.has(id) ? "checked" : "";
    return `<label class="staffItem"><input type="checkbox" ${checked} onchange="toggleStaff('${id}', this.checked)"><span>${id}</span></label>`;
  }).join("") || `<div style="padding:12px;font-size:13px;color:var(--muted);">查無符合的代碼</div>`;
}
function toggleStaff(id, checked){
  if(checked){
    if(staffSelected.size >= 9){ alert("最多選 9 位人員"); renderStaffList(); return; }
    staffSelected.add(id);
  } else {
    staffSelected.delete(id);
  }
  renderStaffChips();
}
function removeStaff(id){
  staffSelected.delete(id);
  renderStaffChips();
  renderStaffList();
}
function renderStaffChips(){
  const wrap = document.getElementById("staffChips");
  wrap.innerHTML = Array.from(staffSelected).map(id=>
    `<span class="chip">${id}<button type="button" onclick="removeStaff('${id}')" aria-label="移除 ${id}">×</button></span>`
  ).join("");
}

function renderMatTabs(){
  matCount = Number(document.getElementById("f_matcount").value);
  const tabWrap = document.getElementById("matTabsWrap");
  tabWrap.innerHTML = "";
  for(let i=1;i<=matCount;i++){
    const b = document.createElement("button");
    b.type="button"; b.className="matTab" + (i===1?" active":"");
    b.textContent = "原料 " + i;
    b.onclick = ()=>showMatForm(i);
    b.dataset.i = i;
    tabWrap.appendChild(b);
  }
  showMatForm(1);
}

function matNameOptions(selectedName){
  return OPTIONS.materials.map(m=>
    `<option value="${m.原料名稱}" ${m.原料名稱===selectedName?"selected":""}>${m.原料名稱}</option>`
  ).join("");
}
function unitOptions(selectedUnit){
  return OPTIONS.units.map(u=>`<option ${u===selectedUnit?"selected":""}>${u}</option>`).join("");

      </div>
      <div class="row3" style="margin-bottom:0;">
        <div><label>退貨</label><input id="m_return_${i}" type="number" value="${d.ret||""}"></div>
        <div><label>退單位</label><select id="m_runit_${i}">${unitOptions(d.runit||unit)}</select></div>
        <div><label>廢棄</label><input id="m_waste_${i}" type="number" value="${d.waste||""}"></div>
      </div>
    </div>`;
}

function applyMaterial(i){
  const name = document.getElementById("m_name_"+i).value;
  const m = OPTIONS.materials.find(x=>x.原料名稱===name);
  if(!m) return;
  document.getElementById("m_code_"+i).value = m.原料編號;
  document.getElementById("m_unit_"+i).value = m.單位;
}

function showMatForm(i){
  saveCurrentMatForm();
  document.querySelectorAll(".matTab").forEach(b=>b.classList.toggle("active", Number(b.dataset.i)===i));
  document.getElementById("matForms").innerHTML = matFieldsHtml(i);
  document.getElementById("matForms").dataset.current = i;
}

function saveCurrentMatForm(){
  const i = document.getElementById("matForms").dataset.current;
  if(!i) return;
  matData[i] = {
    name: valOf("m_name_"+i), date: valOf("m_date_"+i), code: valOf("m_code_"+i),
    use1: valOf("m_use1_"+i), use2: valOf("m_use2_"+i), unit: valOf("m_unit_"+i),
    ret: valOf("m_return_"+i), runit: valOf("m_runit_"+i), waste: valOf("m_waste_"+i)
  };
}
function valOf(id){ const el = document.getElementById(id); return el ? el.value : ""; }

function collectPayload(){
  saveCurrentMatForm();
  const materials = [];
  for(let i=1;i<=matCount;i++){
    const d = matData[i] || {};
    materials.push({
      原料名稱: d.name||"", 原料日: d.date||"", 原料編號: d.code||"",
      使用量件: d.use1||"", 使用量加: d.use2||"", 單位: d.unit||"",
      退貨: d.ret||"", 退單位: d.runit||"", 廢棄: d.waste||""
    });
  }
  const staffArr = Array.from(staffSelected);
  return {
    日期: valOf("f_date"), 組別: valOf("f_group"), 加工人數: valOf("f_people"),
    加工型式: valOf("f_type"),
    包裝時間_起: valOf("f_start"), 包裝時間_迄: valOf("f_end"),
    合計工時分鐘: document.getElementById("f_minutes").textContent,
    到貨日: valOf("f_arrival"),
    記錄: valOf("f_record") || staffArr[0] || "",
    貨號: valOf("f_itemno"), 客戶: valOf("f_cust"), 產品名稱: valOf("f_pname"),
    包裝規格: valOf("f_spec"), 籃入數: valOf("f_basket"), 品質規格: valOf("f_qspec"),
    完成數量: valOf("f_done"), 原料數: matCount, 原料明細: materials,
    標籤別: valOf("f_tagtype"), 標籤編號: valOf("f_tagno"),
    標籤數量張: valOf("f_tagcount"), 標籤作廢張: valOf("f_tagvoid"),
    人員: staffArr, 設備: valOf("f_equip"), 備註: valOf("f_note")
  };
}

async function submitForm(){
  const payload = collectPayload();
  const errBox = document.getElementById("err_required");
  if(!payload.日期 || !payload.客戶 || !payload.產品名稱 || !payload.完成數量){
    errBox.style.display = "block";
    return;
  }
  errBox.style.display = "none";

  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "送出中…";

  const box = document.getElementById("resultBox");
  try{
    const res = await fetch(CONFIG.SUBMIT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json().catch(()=>({}));
    box.className = "ok"; box.style.display = "block";
    box.innerHTML = `<b style="color:var(--accent)">已送出，n8n 已接收</b><br><span style="font-size:13px;color:var(--muted)">系統編號：${data.單號 || "(由 n8n 回傳)"}</span>`;
  }catch(e){
    box.className = "fail"; box.style.display = "block";
    box.innerHTML = `<b style="color:#C0392B">尚未連上 n8n webhook</b>
      <div class="hint" style="margin:6px 0 8px;">請確認 CONFIG.SUBMIT_URL 是否已改成你自己的 n8n webhook 網址，以及該網址是否可從此網頁存取。以下是本次會送出的資料，可先複製給老闆看：</div>
      <pre>${JSON.stringify(payload, null, 2)}</pre>
      <button onclick="navigator.clipboard.writeText(document.querySelector('#resultBox pre').textContent)">複製 JSON</button>`;
  }finally{
    btn.disabled = false; btn.textContent = "儲存並自動寫入 Excel";
  }
}

loadOptions();
</script>
</body>
</html>
